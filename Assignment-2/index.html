<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Place</title>
    <link rel="stylesheet" href="css/styles.css">

    <!-- javascript -->
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Pizza order</h1>

        <!-- student info added to javascript -->
         <p id="studentInfo"></p>
         <form id="pizzaForm">

         <label>Name</label>
         <input type="text" id="name" name="name" required>

         <label>Pizza size</label>
         <select id="pizzaSize" name="pizzaSize" required>
             <option value="">Select a size</option>
             <option value="small">Small</option>
             <option value="medium">Medium</option>
             <option value="large">Large</option>
         </select>

         <label>Quantity</label>
         <input type="number" id="quantity" name="quantity" min="1" required>

         <label>Crust Type</label>
         <select id="crustType" name="crustType" required>
             <option value="">Select a crust type</option>
             <option value="thin">Thin</option>
             <option value="regular">Regular</option>
             <option value="stuffed">Stuffed</option>
         </select>

         <label>Sauce</label>
         <select id="sauce" name="sauce" required>
             <option value="">Select a sauce</option>
             <option value="tomato">Tomato</option>
             <option value="alfredo">Alfredo</option>
             <option value="pesto">Pesto</option>
         </select>

         <label>Toppings</label>
         <div class="toppings">
            <label>
                <input type="checkbox" name="toppings" value="Pepperoni">
                Pepperoni
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Bacon">
                Bacon
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Mushrooms">
                Mushrooms
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Onions">
                Onions
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Green Peppers">
                Green Peppers
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Black Olives">
                Black Olives
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Pineapple">
                Pineapple
            </label>

            <label>
                <input type="checkbox" name="toppings" value="Extra Cheese">
                Extra Cheese
            </label>
        </div>

        <label>Special Instructions</label>
        <textarea id="instructions" name="instructions"></textarea>

         <button type="submit">Order Pizza</button>
         </form>

         <div id="orderSummary"></div>
    </div>
</body>
