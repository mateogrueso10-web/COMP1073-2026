<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See 'N' Say Storymaker</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <h1>See 'N' Say Storymaker</h1>

    <div class="container">

        <div class="column">
            <h2>1</h2>
            <button id="btn1">Cat</button>
        </div>

        <div class="column">
            <h2>2</h2>
            <button id="btn2">Jumped</button>
        </div>

        <div class="column">
            <h2>3</h2>
            <button id="btn3">Park</button>
        </div>

        <div class="column">
            <h2>4</h2>
            <button id="btn4">Ball</button>
        </div>

        <div class="column">
            <h2>5</h2>
            <button id="btn5">Happily</button>
        </div>

        <button id="storyBtn" class="story-btn">
            Generate Story
        </button>

        <button id="resetBtn" class="reset-btn">
            Reset Story
        </button>

        <p id="story"></p>

    </div>

    <script src="js/story.js"></script>

</body>
</html>
